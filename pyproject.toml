[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-pilot"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=4,<6",
  "filelock>=3.16,<4",
  "anthropic>=1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "openpyxl>=3.1"]
parquet = ["pyarrow>=15"]
excel = ["openpyxl>=3.1"]

[project.scripts]
cra = "cra_acquisition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cra_acquisition = ["prompts/*.md", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
